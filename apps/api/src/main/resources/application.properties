# Application Metadata
spring.application.name=api
spring.profiles.active=${APP_ENV:local}

# Database Connection
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:barber_platform}
spring.datasource.username=${POSTGRES_USER:barber_app}
spring.datasource.password=${POSTGRES_PASSWORD:CHANGE_ME_LOCALLY}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator Endpoints Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.barberiasyassin.api=DEBUG
