services:
  db:
    image: postgres:16-alpine
    container_name: barber_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barber_platform}
      POSTGRES_USER: ${POSTGRES_USER:-barber_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_LOCALLY}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barber_app} -d ${POSTGRES_DB:-barber_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: barber_mailpit
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    restart: unless-stopped

volumes:
  postgres_data:
    name: barber_postgres_data
